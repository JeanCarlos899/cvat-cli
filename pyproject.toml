[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-cli"
version = "0.5.0"
readme = "README.md"
description = "Command-line interface for CVAT projects, tasks, data and annotations"
requires-python = ">=3.10"
dependencies = ["cvat-sdk==2.62.0"]

[project.optional-dependencies]
dev = ["ruff>=0.11", "build>=1.2"]

[project.scripts]
cvat = "cvat_cli:entrypoint"

[tool.setuptools]
py-modules = ["cvat_cli", "sampling", "cvat_core"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["F"]
